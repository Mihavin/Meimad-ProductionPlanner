<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <base href="/tv-dashboard/">
  <title>Meimad Machine Status</title>
  <meta name="description" content="Read-only factory-floor machine status dashboard">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Machine status</h1>
    <span
      id="server-status"
      class="server-status server-status-connecting"
      role="status"
      aria-live="polite"
      aria-label="Connecting"
      title="Connecting"></span>
  </header>

  <main id="machine-grid" class="machine-grid" aria-live="polite" aria-busy="true">
    <div class="empty-state">Waiting for machine status</div>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
