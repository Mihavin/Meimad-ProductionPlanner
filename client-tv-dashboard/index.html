<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <base href="/tv-dashboard/">
  <title>Meimad Machine Status</title>
  <meta name="description" content="Read-only factory-floor machine status dashboard">
  <link rel="stylesheet" href="styles.css?v=0.1.39">
  <script>
  // Plain ES5 on purpose: it must run on old TV browsers. When app.js fails to load or
  // to parse, the error is written on the board instead of leaving a black screen.
  (function () {
    var search = window.location.search || "";
    var requested = (/[?&]lang=(he|ru|en)/i.exec(search) || [])[1];
    var browser = String(navigator.language || "en").toLowerCase();
    var lang = requested ? requested.toLowerCase() : browser.indexOf("he") === 0 ? "he" : browser.indexOf("ru") === 0 ? "ru" : "en";
    var labels = { en: "Dashboard script error", he: "שגיאה בסקריפט לוח המכונות", ru: "Ошибка сценария панели станков" };
    window.addEventListener("error", function (event) {
      var grid = document.getElementById("machine-grid");
      if (!grid) return;
      var message = (event && event.message) || "unknown error";
      if (event && event.filename) message += " (" + String(event.filename).replace(/^.*\//, "") + ":" + (event.lineno || 0) + ")";
      grid.innerHTML = "";
      var box = document.createElement("div");
      box.className = "script-error";
      box.setAttribute("role", "alert");
      box.textContent = labels[lang] + ": " + message;
      grid.appendChild(box);
    });
  })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1 id="page-title">Machine status</h1>
      <div id="summary" class="summary" aria-live="polite"></div>
    </div>
    <div class="topbar-tools">
      <span id="clock" class="clock" aria-hidden="true"></span>
      <nav id="language-nav" class="language-nav" aria-label="Language">
        <a href="?lang=en" data-language="en" lang="en">EN</a>
        <a href="?lang=he" data-language="he" lang="he">עב</a>
        <a href="?lang=ru" data-language="ru" lang="ru">РУ</a>
      </nav>
      <button type="button" id="fullscreen-toggle" class="fullscreen-toggle" aria-pressed="false">Full screen</button>
      <span id="server-status" class="server-status server-status-connecting"
        role="status" aria-live="polite" aria-label="Connecting" title="Connecting"></span>
      <span id="server-status-text" class="server-status-text">Connecting</span>
    </div>
  </header>

  <main id="machine-grid" class="machine-grid" aria-live="polite" aria-busy="true">
    <div class="empty-state">Waiting for machine status</div>
  </main>

  <script src="app.js?v=0.1.39" defer></script>
</body>
</html>
